name: release
on:
  push:
    tags:
      - "v*"

jobs:
  release:
    permissions:
      contents: write
      packages: read
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Resolve source branch
        id: source-branch
        run: |
          BRANCH=$(git branch -r --contains "${{ github.sha }}^" --format='%(refname:short)' | grep -v HEAD | head -n1 | sed 's#^origin/##')
          echo "name=${BRANCH}" >> "$GITHUB_OUTPUT"
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: 1.26
      - name: Install Changelog
        run: go install giiena.me/changelog@v0.4.0
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true
          cache-cleanup: on-success
      - name: Restore Fabric Loom cache
        id: loom-cache
        uses: actions/cache/restore@v6
        with:
          path: .gradle/loom-cache
          key: >-
            loom-${{ runner.os }}-${{ steps.source-branch.outputs.name }}-${{ hashFiles(
              '**/build.gradle',
              '**/build.gradle.kts',
              '**/settings.gradle',
              '**/settings.gradle.kts',
              '**/gradle.properties',
              'gradle/libs.versions.toml',
              'gradle/wrapper/gradle-wrapper.properties',
              'build-logic/**/*.gradle',
              'build-logic/**/*.gradle.kts',
              'build-logic/**/*.kt'
            ) }}
          restore-keys: |
            loom-${{ runner.os }}-${{ steps.source-branch.outputs.name }}-
            loom-${{ runner.os }}-
      - name: Build
        uses: nick-fields/retry@v4
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          timeout_minutes: 30
          max_attempts: 5
          retry_wait_seconds: 30
          command: ./gradlew build --stacktrace
      - name: Generate release notes
        run: |
          changelog get "${{ github.ref_name }}" > RELEASE.md
          sed -i '1{/^## \[.*\] - .*/d}' RELEASE.md
          sed -i '/./,$!d' RELEASE.md
      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --draft \
            --title "${{ github.ref_name }}" \
            --notes-file RELEASE.md
      - name: Resolve release jars
        id: jars
        run: |
          FABRIC_JAR=$(ls fabric/build/libs/*.jar | grep -v -- '-sources.jar' | grep -v -- '-javadoc.jar')
          NEOFORGE_JAR=$(ls neoforge/build/libs/*.jar | grep -v -- '-sources.jar' | grep -v -- '-javadoc.jar')
          echo "fabric=${FABRIC_JAR}" >> "$GITHUB_OUTPUT"
          echo "neoforge=${NEOFORGE_JAR}" >> "$GITHUB_OUTPUT"
      - name: Upload Fabric artifacts
        uses: actions/upload-artifact@v7
        with:
          name: fabric
          path: fabric/build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
      - name: Upload NeoForge artifacts
        uses: actions/upload-artifact@v7
        with:
          name: neoforge
          path: neoforge/build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
      - name: Upload release artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.ref_name }}" \
            "${{ steps.jars.outputs.fabric }}" \
            "${{ steps.jars.outputs.neoforge }}"
      - name: Parse tag
        id: parse_tag
        run: |
          tag="${{ github.ref_name }}"
          # Strip leading 'v', then split on '+' into mod_version and mc_version.
          # v0.2.0+26.2 -> mod_version=0.2.0, mc_version=26.2
          stripped="${tag#v}"
          mod_version="${stripped%%+*}"
          mc_version="${stripped#*+}"
          if [ -z "$mod_version" ] || [ -z "$mc_version" ] || [ "$mod_version" = "$stripped" ]; then
            echo "Tag '$tag' does not match expected format vX.Y.Z+MC_VERSION" >&2
            exit 1
          fi
          echo "mod_version=$mod_version" >> "$GITHUB_OUTPUT"
          echo "mc_version=$mc_version" >> "$GITHUB_OUTPUT"
      - name: Publish to Modrinth & CurseForge (Fabric)
        uses: Kir-Antipov/mc-publish@v3
        with:
          modrinth-id: ${{ vars.MODRINTH_PROJECT_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          curseforge-id: ${{ vars.CURSEFORGE_PROJECT_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          files: fabric/build/libs/!(*-@(dev|sources|javadoc)).jar
          loaders: fabric
          game-versions: ${{ steps.parse_tag.outputs.mc_version }}
          version: ${{ steps.parse_tag.outputs.mod_version }}+${{ steps.parse_tag.outputs.mc_version }}
          changelog-file: RELEASE.md
          version-type: alpha
      - name: Publish to Modrinth & CurseForge (NeoForge)
        uses: Kir-Antipov/mc-publish@v3
        with:
          modrinth-id: ${{ vars.MODRINTH_PROJECT_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          curseforge-id: ${{ vars.CURSEFORGE_PROJECT_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          files: neoforge/build/libs/!(*-@(dev|sources|javadoc)).jar
          loaders: neoforge
          game-versions: ${{ steps.parse_tag.outputs.mc_version }}
          version: ${{ steps.parse_tag.outputs.mod_version }}+${{ steps.parse_tag.outputs.mc_version }}
          changelog-file: RELEASE.md
          version-type: alpha
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${{ github.ref_name }}" --draft=false
